<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE9 AP — Configuration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #0a0c0e;
            --bg1: #12161a;
            --bg2: #1a2128;
            --line: #2a333c;
            --text: #e8ecef;
            --muted: #8a969f;
            --accent: #c9a227;
            --ok: #3d8f5a;
            --focus: #d4b84a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "IBM Plex Sans", sans-serif;
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(155, 44, 44, 0.22), transparent 55%),
                radial-gradient(900px 500px at 90% 0%, rgba(201, 162, 39, 0.12), transparent 50%),
                linear-gradient(180deg, #0d1013 0%, var(--bg0) 40%, #080a0c 100%);
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 20px 72px;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-tabs {
            display: inline-flex;
            border: 1px solid var(--line);
            background: var(--bg1);
        }

        .lang-tabs button {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
        }

        .lang-tabs button.active {
            background: var(--accent);
            color: #14110a;
        }

        .lang-tabs button:not(.active):hover {
            color: var(--text);
            filter: none;
        }

        .hero-logo {
            display: block;
            width: min(340px, 80vw);
            max-width: 100%;
            height: auto;
            aspect-ratio: 1;
            margin: 8px auto 20px;
            object-fit: contain;
            background: #000;
            filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.65));
        }

        .hero-logo-missing {
            display: none;
            text-align: center;
            color: #c45c5c;
            margin: 0 0 12px;
            font-size: 0.9rem;
        }

        .brand {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 800;
            font-size: clamp(2.6rem, 8vw, 4.2rem);
            letter-spacing: 0.04em;
            line-height: 0.95;
            text-transform: uppercase;
            margin: 0 0 8px;
            color: #f2f4f6;
            text-align: center;
        }

        .brand span { color: var(--accent); }

        .tagline {
            margin: 0 auto 36px;
            color: var(--muted);
            font-size: 1.05rem;
            max-width: 40ch;
            text-align: center;
        }

        h2 {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 36px 0 12px;
            color: var(--accent);
        }

        .step {
            background: linear-gradient(180deg, var(--bg2), var(--bg1));
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent);
            padding: 16px 18px;
            margin: 0 0 12px;
        }

        .step p {
            margin: 0;
            color: var(--text);
            line-height: 1.5;
        }

        .step .hint {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-size: 0.92rem;
            color: var(--muted);
        }

        input, select, textarea {
            width: 100%;
            background: #0e1216;
            color: var(--text);
            border: 1px solid var(--line);
            padding: 11px 12px;
            font: inherit;
            border-radius: 2px;
        }

        input:focus, select:focus, textarea:focus {
            outline: 1px solid var(--focus);
            border-color: var(--focus);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 560px) {
            .row { grid-template-columns: 1fr; }
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            background: var(--accent);
            color: #14110a;
        }

        button.secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
        }

        button:hover { filter: brightness(1.08); }
        button.secondary:hover { border-color: var(--accent); color: var(--accent); }

        a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 12px 18px;
            background: var(--accent);
            color: #14110a;
        }

        a.btn:hover { filter: brightness(1.08); }

        a.btn.disabled {
            pointer-events: none;
            opacity: 0.45;
            filter: none;
        }

        .download-box {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .download-box .info {
            flex: 1;
            min-width: 200px;
        }

        .download-box .info strong {
            display: block;
            font-family: "Barlow Condensed", sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(120%);
            background: var(--bg2);
            border: 1px solid var(--ok);
            color: var(--text);
            padding: 12px 18px;
            opacity: 0;
            transition: transform 0.35s ease, opacity 0.35s ease;
            z-index: 20;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .meta {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.85rem;
        }

        .meta code {
            color: var(--accent);
            font-size: 0.9em;
        }

        .visitors {
            display: flex;
            justify-content: center;
            margin: 0 0 28px;
        }

        .visitors img {
            height: 20px;
            width: auto;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="lang-tabs" role="tablist" aria-label="Language">
            <button type="button" role="tab" data-lang="fr" class="active" aria-selected="true">FR</button>
            <button type="button" role="tab" data-lang="en" aria-selected="false">EN</button>
        </div>
    </div>

    <img class="hero-logo" id="heroLogo" src="assets/logo.png?v=3" alt="Resident Evil Requiem AP" width="340" height="340">
    <p class="hero-logo-missing" id="heroLogoMissing">Logo introuvable : place <code>assets/logo.png</code> à côté de cette page.</p>
    <h1 class="brand">Resident Evil<br><span>Requiem AP</span></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="visitors">
        <img src="https://visitor-badge.laobi.icu/badge?page_id=Lechapelier&amp;left_text=visitors" alt="visitor badge">
    </div>

    <h2 data-i18n="h_source"></h2>
    <div class="step">
        <div class="download-box">
            <div class="info">
                <strong>RE9 AP Source code</strong>
                <p data-i18n="source_desc"></p>
                <p class="hint" id="sourceVersionHint"></p>
            </div>
            <a class="btn" id="sourceDownloadBtn" href="#" target="_blank" rel="noopener noreferrer" data-i18n="btn_download"></a>
        </div>
    </div>

    <h2 data-i18n="h_download"></h2>
    <div class="step">
        <div class="download-box">
            <div class="info">
                <strong>RE9 AP Client</strong>
                <p data-i18n="client_desc"></p>
                <p class="hint" id="clientVersionHint"></p>
            </div>
            <a class="btn" id="clientDownloadBtn" href="#" target="_blank" rel="noopener noreferrer" data-i18n="btn_download"></a>
        </div>
    </div>

    <h2 data-i18n="h_install"></h2>
    <div class="step">
        <p data-i18n-html="install_p"></p>
        <p class="hint" data-i18n="install_hint"></p>
    </div>

    <h2 data-i18n="h_connect"></h2>
    <div class="step">
        <p data-i18n-html="connect_p"></p>
        <p class="hint" data-i18n-html="connect_hint"></p>
    </div>

    <h2 data-i18n="h_bug"></h2>
    <div class="step">
        <p data-i18n-html="bug_intro"></p>
        <p class="hint" data-i18n-html="bug_hint"></p>
    </div>

    <p class="meta" data-i18n-html="meta"></p>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
    const $ = (id) => document.getElementById(id);
    const toastEl = $("toast");
    let toastTimer;
    let lang = localStorage.getItem("re9ap_lang") || "fr";

    const SOURCE_DOWNLOAD_URL = "https://github.com/LechapelierHD/Re9-archipelago/releases/download/v1.0.54/RE9-AP-Source-1.0.54.zip";
    const SOURCE_VERSION = "1.0.54";
    const CLIENT_DOWNLOAD_URL = "https://github.com/LechapelierHD/Re9-archipelago/releases/download/v1.0.54/RE9-AP-Client-1.0.54.zip";
    const CLIENT_VERSION = "1.0.54";

    const heroLogo = $("heroLogo");
    const heroMissing = $("heroLogoMissing");
    if (heroLogo && heroMissing) {
        heroLogo.addEventListener("error", () => {
            heroLogo.style.display = "none";
            heroMissing.style.display = "block";
        });
    }

    const I18N = {
        fr: {
            title: "RE9 AP — Configuration",
            tagline: "Guide rapide pour le client RE9 Archipelago.",
            h_source: "Télécharger le source code",
            source_desc: "Code source Archipelago pour Resident Evil Requiem (Lua, apworld Python, lanceur C#).",
            hint_source_paste: "Source code non configuré pour le moment.",
            hint_source_ready: "Clique sur Télécharger pour obtenir le source code.",
            h_download: "Télécharger le client",
            client_desc: "Launcher + scripts Archipelago pour Resident Evil Requiem.",
            hint_paste: "Client non configuré pour le moment.",
            hint_ready: "Clique sur Télécharger pour obtenir le client.",
            hint_version: "Version {v}",
            btn_download: "Télécharger",
            h_install: "1. Installation",
            install_p: "Installe <strong>Resident Evil Requiem</strong> via Steam, télécharge le client ci-dessus, puis lance <code>RE9.AP.Launcher.exe</code>.",
            install_hint: "Le launcher pose REFramework + les scripts Lua ArchipelagoRE9. Relance le jeu après une mise à jour de patch.",
            h_connect: "2. Connexion in-game",
            connect_p: "Génère le multiworld avec Archipelago (apworld <strong>Resident Evil Requiem</strong>), puis dans le jeu ouvre l’UI RE9 AP :",
            connect_hint: "Serveur · Nom du slot · Mot de passe → <strong>Enregistrer et connecter</strong>. La difficulté YAML doit être celle de ta save.",
            h_bug: "3. Bug ou problème ?",
            bug_intro: "En cas de bug, crash ou autre problème, envoyez-moi votre <strong>RE9-bugreport</strong> avec une description claire (ce que vous avez fait + ce qui s’est passé).",
            bug_hint: "Joignez si possible le journal <code>re2_framework_log.txt</code> (dossier du jeu) — lignes <code>[RE9 AP]</code>.",
            meta: "Client cible : dossier <code>Resident Evil 9 AP</code> · jeu AP : <code>Resident Evil Requiem</code>",
        },
        en: {
            title: "RE9 AP — Setup",
            tagline: "Quick guide for the RE9 Archipelago client.",
            h_source: "Download the source code",
            source_desc: "Archipelago source code for Resident Evil Requiem (Lua, Python apworld, C# launcher).",
            hint_source_paste: "Source code not configured yet.",
            hint_source_ready: "Click Download to get the source code.",
            h_download: "Download the client",
            client_desc: "Launcher + Archipelago scripts for Resident Evil Requiem.",
            hint_paste: "Client not configured yet.",
            hint_ready: "Click Download to get the client.",
            hint_version: "Version {v}",
            btn_download: "Download",
            h_install: "1. Install",
            install_p: "Install <strong>Resident Evil Requiem</strong> via Steam, download the client above, then run <code>RE9.AP.Launcher.exe</code>.",
            install_hint: "The launcher installs REFramework + ArchipelagoRE9 Lua scripts. Restart the game after a patch update.",
            h_connect: "2. In-game connection",
            connect_p: "Generate the multiworld with Archipelago (<strong>Resident Evil Requiem</strong> apworld), then open the RE9 AP UI in-game:",
            connect_hint: "Server · Slot name · Password → <strong>Save and connect</strong>. YAML difficulty must match your save.",
            h_bug: "3. Bug or problem?",
            bug_intro: "If you hit a bug, crash, or other issue, please send me your <strong>RE9-bugreport</strong> with a clear description (what you did + what happened).",
            bug_hint: "If possible, attach <code>re2_framework_log.txt</code> (game folder) — lines starting with <code>[RE9 AP]</code>.",
            meta: "Target client folder: <code>Resident Evil 9 AP</code> · AP game: <code>Resident Evil Requiem</code>",
        },
    };

    function t(key) {
        return (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
    }

    function applyLang() {
        document.documentElement.lang = lang;
        document.title = t("title");

        document.querySelectorAll("[data-i18n]").forEach((el) => {
            el.textContent = t(el.getAttribute("data-i18n"));
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
            el.innerHTML = t(el.getAttribute("data-i18n-html"));
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
            el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
        });

        document.querySelectorAll(".lang-tabs button").forEach((btn) => {
            const active = btn.getAttribute("data-lang") === lang;
            btn.classList.toggle("active", active);
            btn.setAttribute("aria-selected", active ? "true" : "false");
        });

        syncSourceDownload();
        syncClientDownload();
        localStorage.setItem("re9ap_lang", lang);
    }

    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function syncDownload(btnId, hintId, url, version, pasteKey, readyKey) {
        const btn = $(btnId);
        const hint = $(hintId);
        if (!btn || !hint) return;
        const cleanUrl = (url || "").trim();
        const cleanVersion = (version || "").trim();
        const valid = /^https?:\/\//i.test(cleanUrl);

        btn.href = valid ? cleanUrl : "#";
        btn.classList.toggle("disabled", !valid);
        if (!valid) {
            hint.textContent = t(pasteKey);
        } else if (cleanVersion) {
            hint.textContent = t("hint_version").replace("{v}", cleanVersion);
        } else {
            hint.textContent = t(readyKey);
        }
    }

    function syncSourceDownload() {
        syncDownload("sourceDownloadBtn", "sourceVersionHint", SOURCE_DOWNLOAD_URL, SOURCE_VERSION,
            "hint_source_paste", "hint_source_ready");
    }

    function syncClientDownload() {
        syncDownload("clientDownloadBtn", "clientVersionHint", CLIENT_DOWNLOAD_URL, CLIENT_VERSION,
            "hint_paste", "hint_ready");
    }

    document.querySelectorAll(".lang-tabs button").forEach((btn) => {
        btn.addEventListener("click", () => {
            lang = btn.getAttribute("data-lang");
            applyLang();
        });
    });

    applyLang();
})();
</script>
</body>
</html>
