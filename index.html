<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE9 AP — Configuration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #0a0c0e;
            --bg1: #12161a;
            --bg2: #1a2128;
            --line: #2a333c;
            --text: #e8ecef;
            --muted: #8a969f;
            --accent: #c9a227;
            --ok: #3d8f5a;
            --focus: #d4b84a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "IBM Plex Sans", sans-serif;
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(155, 44, 44, 0.22), transparent 55%),
                radial-gradient(900px 500px at 90% 0%, rgba(201, 162, 39, 0.12), transparent 50%),
                linear-gradient(180deg, #0d1013 0%, var(--bg0) 40%, #080a0c 100%);
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 20px 72px;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-tabs {
            display: inline-flex;
            border: 1px solid var(--line);
            background: var(--bg1);
        }

        .lang-tabs button {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
        }

        .lang-tabs button.active {
            background: var(--accent);
            color: #14110a;
        }

        .lang-tabs button:not(.active):hover {
            color: var(--text);
            filter: none;
        }

        .hero-logo {
            display: block;
            width: min(340px, 80vw);
            max-width: 100%;
            height: auto;
            aspect-ratio: 1;
            margin: 8px auto 20px;
            object-fit: contain;
            background: #000;
            filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.65));
        }

        .hero-logo-missing {
            display: none;
            text-align: center;
            color: #c45c5c;
            margin: 0 0 12px;
            font-size: 0.9rem;
        }

        .brand {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 800;
            font-size: clamp(2.6rem, 8vw, 4.2rem);
            letter-spacing: 0.04em;
            line-height: 0.95;
            text-transform: uppercase;
            margin: 0 0 8px;
            color: #f2f4f6;
            text-align: center;
        }

        .brand span { color: var(--accent); }

        .tagline {
            margin: 0 auto 36px;
            color: var(--muted);
            font-size: 1.05rem;
            max-width: 40ch;
            text-align: center;
        }

        h2 {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.55rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 36px 0 12px;
            color: var(--accent);
        }

        .step {
            background: linear-gradient(180deg, var(--bg2), var(--bg1));
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent);
            padding: 16px 18px;
            margin: 0 0 12px;
        }

        .step p {
            margin: 0;
            color: var(--text);
            line-height: 1.5;
        }

        .step .hint {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-size: 0.92rem;
            color: var(--muted);
        }

        input, select, textarea {
            width: 100%;
            background: #0e1216;
            color: var(--text);
            border: 1px solid var(--line);
            padding: 11px 12px;
            font: inherit;
            border-radius: 2px;
        }

        input:focus, select:focus, textarea:focus {
            outline: 1px solid var(--focus);
            border-color: var(--focus);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 560px) {
            .row { grid-template-columns: 1fr; }
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            background: var(--accent);
            color: #14110a;
        }

        button.secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
        }

        button:hover { filter: brightness(1.08); }
        button.secondary:hover { border-color: var(--accent); color: var(--accent); }

        a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 12px 18px;
            background: var(--accent);
            color: #14110a;
        }

        a.btn:hover { filter: brightness(1.08); }

        a.btn.disabled {
            pointer-events: none;
            opacity: 0.45;
            filter: none;
        }

        .download-box {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .download-box .info {
            flex: 1;
            min-width: 200px;
        }

        .download-box .info strong {
            display: block;
            font-family: "Barlow Condensed", sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        #preview {
            margin-top: 14px;
            min-height: 180px;
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            font-size: 0.82rem;
            line-height: 1.45;
            white-space: pre;
            resize: vertical;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(120%);
            background: var(--bg2);
            border: 1px solid var(--ok);
            color: var(--text);
            padding: 12px 18px;
            opacity: 0;
            transition: transform 0.35s ease, opacity 0.35s ease;
            z-index: 20;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .meta {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.85rem;
        }

        .meta code {
            color: var(--accent);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div class="lang-tabs" role="tablist" aria-label="Language">
            <button type="button" role="tab" data-lang="fr" class="active" aria-selected="true">FR</button>
            <button type="button" role="tab" data-lang="en" aria-selected="false">EN</button>
        </div>
    </div>

    <img class="hero-logo" id="heroLogo" src="assets/logo.png?v=3" alt="Resident Evil Requiem AP" width="340" height="340">
    <p class="hero-logo-missing" id="heroLogoMissing">Logo introuvable : place <code>assets/logo.png</code> à côté de cette page.</p>
    <h1 class="brand">Resident Evil<br><span>Requiem AP</span></h1>
    <p class="tagline" data-i18n="tagline"></p>

    <h2 data-i18n="h_download"></h2>
    <div class="step">
        <div class="download-box">
            <div class="info">
                <strong>RE9 AP Client</strong>
                <p data-i18n="client_desc"></p>
                <p class="hint" id="clientVersionHint"></p>
            </div>
            <a class="btn" id="clientDownloadBtn" href="#" target="_blank" rel="noopener noreferrer" data-i18n="btn_download"></a>
        </div>
    </div>

    <h2 data-i18n="h_install"></h2>
    <div class="step">
        <p data-i18n-html="install_p"></p>
        <p class="hint" data-i18n="install_hint"></p>
    </div>

    <h2 data-i18n="h_yaml"></h2>
    <div class="step">
        <div class="row">
            <div>
                <label for="playerName" data-i18n="label_slot"></label>
                <input id="playerName" type="text" maxlength="16" value="Player" autocomplete="off">
            </div>
            <div>
                <label for="description" data-i18n="label_description"></label>
                <input id="description" type="text" value="RE9 AP config">
            </div>
        </div>

        <label for="difficulty" data-i18n="label_difficulty"></label>
        <select id="difficulty">
            <option value="casual">Casual</option>
            <option value="modern" selected>Modern</option>
            <option value="classic">Classic</option>
            <option value="insanity">Insanity</option>
        </select>

        <div class="row">
            <div>
                <label for="keyItems">Key Items</label>
                <select id="keyItems">
                    <option value="vanilla" data-i18n="opt_vanilla">Vanilla</option>
                    <option value="shuffled">Shuffled</option>
                </select>
            </div>
            <div>
                <label for="flagItems">Flag Items</label>
                <select id="flagItems">
                    <option value="vanilla" data-i18n="opt_vanilla">Vanilla</option>
                    <option value="shuffled">Shuffled</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div>
                <label for="enemyDrops">Enemy Drops (0–50)</label>
                <input id="enemyDrops" type="number" min="0" max="50" value="15">
            </div>
            <div>
                <label for="deathLink">Death Link</label>
                <select id="deathLink">
                    <option value="false">Off</option>
                    <option value="true">On</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div>
                <label for="accessibility">Accessibility</label>
                <select id="accessibility">
                    <option value="full" selected>Full</option>
                    <option value="minimal">Minimal</option>
                </select>
            </div>
            <div>
                <label for="balancing">Progression Balancing</label>
                <select id="balancing">
                    <option value="disabled">Disabled (0)</option>
                    <option value="normal" selected>Normal (50)</option>
                    <option value="extreme">Extreme (99)</option>
                </select>
            </div>
        </div>

        <div class="actions">
            <button type="button" id="generateBtn" data-i18n="btn_generate"></button>
            <button type="button" class="secondary" id="copyBtn" data-i18n="btn_copy"></button>
            <button type="button" class="secondary" id="downloadBtn" data-i18n="btn_dl_yaml"></button>
        </div>

        <label for="preview" data-i18n="label_preview"></label>
        <textarea id="preview" readonly spellcheck="false"></textarea>
    </div>

    <h2 data-i18n="h_connect"></h2>
    <div class="step">
        <p data-i18n-html="connect_p"></p>
        <p class="hint" data-i18n-html="connect_hint"></p>
    </div>

    <h2 data-i18n="h_bug"></h2>
    <div class="step">
        <p data-i18n="bug_intro"></p>
        <p class="hint" data-i18n-html="bug_hint"></p>
    </div>

    <p class="meta" data-i18n-html="meta"></p>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
    const $ = (id) => document.getElementById(id);
    const toastEl = $("toast");
    let toastTimer;
    let lang = localStorage.getItem("re9ap_lang") || "fr";

    const CLIENT_DOWNLOAD_URL = "https://github.com/LechapelierHD/Re9-archipelago/releases/download/v1.0.50/RE9-AP-Client-1.0.50.zip";
    const CLIENT_VERSION = "1.0.50"; // build: 1.0.50 sync

    const heroLogo = $("heroLogo");
    const heroMissing = $("heroLogoMissing");
    if (heroLogo && heroMissing) {
        heroLogo.addEventListener("error", () => {
            heroLogo.style.display = "none";
            heroMissing.style.display = "block";
        });
    }

    const I18N = {
        fr: {
            title: "RE9 AP — Configuration",
            tagline: "Guide rapide et générateur YAML pour le client RE9 Archipelago.",
            h_download: "Télécharger le client",
            client_desc: "Launcher + scripts Archipelago pour Resident Evil Requiem.",
            hint_paste: "Client non configuré pour le moment.",
            hint_ready: "Clique sur Télécharger pour obtenir le client.",
            hint_version: "Version {v}",
            btn_download: "Télécharger",
            label_client_url: "Lien de téléchargement du client",
            label_client_version: "Version affichée (optionnel)",
            ph_client_url: "https://…/RE9.AP.Client.zip",
            ph_client_version: "ex. 1.0.50",
            h_install: "1. Installation",
            install_p: "Installe <strong>Resident Evil Requiem</strong> via Steam, télécharge le client ci-dessus, puis lance <code>RE9.AP.Launcher.exe</code>.",
            install_hint: "Le launcher pose REFramework + les scripts Lua ArchipelagoRE9. Relance le jeu après une mise à jour de patch.",
            h_yaml: "2. Options YAML",
            label_slot: "Nom du slot (16 car. max)",
            label_description: "Description",
            label_difficulty: "Difficulté (doit matcher ta save)",
            opt_vanilla: "Vanilla (sûr)",
            btn_generate: "Générer le YAML",
            btn_copy: "Copier",
            btn_dl_yaml: "Télécharger .yaml",
            label_preview: "Aperçu",
            h_connect: "3. Connexion in-game",
            connect_p: "Génère le multiworld avec Archipelago (apworld <strong>Resident Evil Requiem</strong>), puis dans le jeu ouvre l’UI RE9 AP :",
            connect_hint: "Serveur · Nom du slot · Mot de passe → <strong>Enregistrer et connecter</strong>. La difficulté YAML doit être celle de ta save.",
            h_bug: "4. Bug ou problème ?",
            bug_intro: "En cas de bug, crash ou autre problème, contacte le développeur avec une description claire (ce que tu as fait + ce qui s’est passé).",
            bug_hint: "Joins si possible le journal <code>re2_framework_log.txt</code> (dossier du jeu) — lignes <code>[RE9 AP]</code>.",
            meta: "Client cible : dossier <code>Resident Evil 9 AP</code> · jeu AP : <code>Resident Evil Requiem</code>",
            toast_gen: "YAML généré pour Resident Evil Requiem",
            toast_copy: "YAML copié",
            toast_dl: "Fichier .yaml téléchargé",
        },
        en: {
            title: "RE9 AP — Setup",
            tagline: "Quick guide and YAML generator for the RE9 Archipelago client.",
            h_download: "Download the client",
            client_desc: "Launcher + Archipelago scripts for Resident Evil Requiem.",
            hint_paste: "Client not configured yet.",
            hint_ready: "Click Download to get the client.",
            hint_version: "Version {v}",
            btn_download: "Download",
            label_client_url: "Client download link",
            label_client_version: "Displayed version (optional)",
            ph_client_url: "https://…/RE9.AP.Client.zip",
            ph_client_version: "e.g. 1.0.50",
            h_install: "1. Install",
            install_p: "Install <strong>Resident Evil Requiem</strong> via Steam, download the client above, then run <code>RE9.AP.Launcher.exe</code>.",
            install_hint: "The launcher installs REFramework + ArchipelagoRE9 Lua scripts. Restart the game after a patch update.",
            h_yaml: "2. YAML options",
            label_slot: "Slot name (16 chars max)",
            label_description: "Description",
            label_difficulty: "Difficulty (must match your save)",
            opt_vanilla: "Vanilla (safe)",
            btn_generate: "Generate YAML",
            btn_copy: "Copy",
            btn_dl_yaml: "Download .yaml",
            label_preview: "Preview",
            h_connect: "3. In-game connection",
            connect_p: "Generate the multiworld with Archipelago (<strong>Resident Evil Requiem</strong> apworld), then open the RE9 AP UI in-game:",
            connect_hint: "Server · Slot name · Password → <strong>Save and connect</strong>. YAML difficulty must match your save.",
            h_bug: "4. Bug or problem?",
            bug_intro: "If you hit a bug, crash, or other issue, contact the developer with a clear description (what you did + what happened).",
            bug_hint: "If possible, attach <code>re2_framework_log.txt</code> (game folder) — lines starting with <code>[RE9 AP]</code>.",
            meta: "Target client folder: <code>Resident Evil 9 AP</code> · AP game: <code>Resident Evil Requiem</code>",
            toast_gen: "YAML generated for Resident Evil Requiem",
            toast_copy: "YAML copied",
            toast_dl: "YAML file downloaded",
        },
    };

    function t(key) {
        return (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
    }

    function applyLang() {
        document.documentElement.lang = lang;
        document.title = t("title");

        document.querySelectorAll("[data-i18n]").forEach((el) => {
            el.textContent = t(el.getAttribute("data-i18n"));
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
            el.innerHTML = t(el.getAttribute("data-i18n-html"));
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
            el.placeholder = t(el.getAttribute("data-i18n-placeholder"));
        });

        document.querySelectorAll(".lang-tabs button").forEach((btn) => {
            const active = btn.getAttribute("data-lang") === lang;
            btn.classList.toggle("active", active);
            btn.setAttribute("aria-selected", active ? "true" : "false");
        });

        syncClientDownload();
        localStorage.setItem("re9ap_lang", lang);
    }

    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function syncClientDownload() {
        const btn = $("clientDownloadBtn");
        const hint = $("clientVersionHint");
        const url = (CLIENT_DOWNLOAD_URL || "").trim();
        const version = (CLIENT_VERSION || "").trim();
        const valid = /^https?:\/\//i.test(url);

        btn.href = valid ? url : "#";
        btn.classList.toggle("disabled", !valid);
        if (!valid) {
            hint.textContent = t("hint_paste");
        } else if (version) {
            hint.textContent = t("hint_version").replace("{v}", version);
        } else {
            hint.textContent = t("hint_ready");
        }
    }

    document.querySelectorAll(".lang-tabs button").forEach((btn) => {
        btn.addEventListener("click", () => {
            lang = btn.getAttribute("data-lang");
            applyLang();
        });
    });

    function choiceBlock(selected, options) {
        return options.map((opt) =>
            `    ${opt}: ${opt === selected ? 50 : 0}`
        ).join("\n");
    }

    function buildYaml() {
        const name = ($("playerName").value || "Player").trim().slice(0, 16);
        const description = ($("description").value || "RE9 AP config").trim();
        const difficulty = $("difficulty").value;
        const keyItems = $("keyItems").value;
        const flagItems = $("flagItems").value;
        let drops = parseInt($("enemyDrops").value, 10);
        if (Number.isNaN(drops)) drops = 15;
        drops = Math.max(0, Math.min(50, drops));
        $("enemyDrops").value = String(drops);
        const deathLink = $("deathLink").value;
        const accessibility = $("accessibility").value;
        const balancing = $("balancing").value;

        return `# Generated for Resident Evil Requiem (RE9 AP)
name: ${name}
description: ${description}
game: Resident Evil Requiem
requires:
  version: 0.6.8

Resident Evil Requiem:
  progression_balancing:
${choiceBlock(balancing, ["random", "random-low", "random-high", "disabled", "normal", "extreme"])}

  accessibility:
${choiceBlock(accessibility, ["full", "minimal"])}

  game_difficulty:
${choiceBlock(difficulty, ["casual", "modern", "classic", "insanity"])}

  key_items:
${choiceBlock(keyItems, ["vanilla", "shuffled"])}

  flag_items:
${choiceBlock(flagItems, ["vanilla", "shuffled"])}

  enemy_drops:
    ${drops}: 50

  death_link:
    'false': ${deathLink === "false" ? 50 : 0}
    'true': ${deathLink === "true" ? 50 : 0}
`;
    }

    function refresh() {
        $("preview").value = buildYaml();
    }

    $("generateBtn").addEventListener("click", () => {
        refresh();
        toast(t("toast_gen"));
    });

    $("copyBtn").addEventListener("click", async () => {
        refresh();
        try {
            await navigator.clipboard.writeText($("preview").value);
            toast(t("toast_copy"));
        } catch {
            $("preview").select();
            document.execCommand("copy");
            toast(t("toast_copy"));
        }
    });

    $("downloadBtn").addEventListener("click", () => {
        refresh();
        const name = ($("playerName").value || "Player").trim().slice(0, 16) || "Player";
        const blob = new Blob([$("preview").value], { type: "text/yaml;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${name.replace(/[^\w\-]+/g, "_")}_RE9.yaml`;
        a.click();
        URL.revokeObjectURL(a.href);
        toast(t("toast_dl"));
    });

    [
        "playerName", "description", "difficulty", "keyItems", "flagItems",
        "enemyDrops", "deathLink", "accessibility", "balancing"
    ].forEach((id) => $(id).addEventListener("input", refresh));

    applyLang();
    refresh();
})();
</script>
</body>
</html>
