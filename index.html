<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE9 AP — Setup</title>
    <meta name="description" content="Resident Evil Requiem Archipelago client — download, install, and join the community.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0d1f24;
            --ink-soft: #2a4a54;
            --foam: #dff3f0;
            --sea: #1a6f7a;
            --sea-deep: #0b3d46;
            --matrix: #4ade80;
            --matrix-dim: #2f9e5f;
            --line: rgba(16, 36, 44, 0.14);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "DM Sans", sans-serif;
            background: linear-gradient(180deg, #e8f6f3 0%, var(--foam) 40%, #d5ece8 100%);
            line-height: 1.5;
        }

        a { color: inherit; }

        .site-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(10px);
            background: rgba(223, 243, 240, 0.9);
            border-bottom: 1px solid var(--line);
        }

        .site-nav-inner {
            width: min(1000px, calc(100% - 2.5rem));
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
        }

        .brand-link {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-right: auto;
            text-decoration: none;
            font-family: "Unbounded", sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--sea-deep);
        }

        .brand-link img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            display: block;
        }

        .lang-tabs { display: inline-flex; gap: 0.15rem; }
        .lang-tabs button {
            font-family: "Unbounded", sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: none;
            background: transparent;
            color: var(--ink-soft);
            padding: 0.55rem 0.7rem;
            border-bottom: 2px solid transparent;
            cursor: pointer;
        }
        .lang-tabs button.active {
            color: var(--sea-deep);
            border-bottom-color: var(--matrix-dim);
        }
        .lang-tabs button:not(.active):hover { color: var(--sea-deep); }

        .hero {
            position: relative;
            min-height: calc(100svh - 58px);
            display: grid;
            place-items: center;
            overflow: hidden;
            color: var(--foam);
            text-align: center;
            isolation: isolate;
        }

        .hero-visual {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse 55% 45% at 50% 40%, rgba(74, 222, 128, 0.12), transparent 60%),
                radial-gradient(ellipse 40% 35% at 18% 70%, rgba(125, 211, 252, 0.14), transparent 55%),
                radial-gradient(ellipse 35% 30% at 85% 25%, rgba(58, 168, 181, 0.18), transparent 50%),
                linear-gradient(165deg, #061820 0%, #0a2f3a 28%, #0d4552 58%, #083038 100%);
        }

        .mw-sky {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 18%, rgba(223, 243, 240, 0.55), transparent),
                radial-gradient(1.5px 1.5px at 28% 42%, rgba(74, 222, 128, 0.45), transparent),
                radial-gradient(1px 1px at 63% 28%, rgba(125, 211, 252, 0.5), transparent),
                radial-gradient(1px 1px at 78% 55%, rgba(223, 243, 240, 0.35), transparent),
                radial-gradient(1.5px 1.5px at 88% 16%, rgba(74, 222, 128, 0.4), transparent);
            opacity: 0.85;
        }

        .mw-sky { animation: star-twinkle 6s ease-in-out infinite alternate; }

        .mw-map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.85;
        }

        .mw-links path { animation: link-flow 8s linear infinite; }
        .mw-links path:nth-child(2) { animation-duration: 11s; animation-direction: reverse; }
        .mw-links path:nth-child(3) { animation-duration: 9s; }

        .mw-portals circle {
            transform-origin: center;
            transform-box: fill-box;
            animation: portal-pulse 5s var(--ease) infinite;
        }
        .mw-portals circle:nth-child(2) { animation-delay: 0.6s; }
        .mw-portals circle:nth-child(3) { animation-delay: 1.2s; }
        .mw-portals circle:nth-child(4) { animation-delay: 1.8s; }

        .mw-nodes circle { animation: node-glow 3.2s ease-in-out infinite alternate; }
        .mw-nodes circle:nth-child(odd) { animation-delay: 0.8s; }

        .mw-islands ellipse {
            transform-origin: center;
            transform-box: fill-box;
            animation: island-drift 14s var(--ease) infinite alternate;
        }
        .mw-islands ellipse:nth-child(2) { animation-duration: 18s; animation-delay: 1s; }
        .mw-islands ellipse:nth-child(3) { animation-duration: 16s; animation-delay: 2s; }
        .mw-islands ellipse:nth-child(4) { animation-duration: 20s; animation-delay: 0.5s; }

        .hero-logo { animation: logo-float 5.5s var(--ease) infinite; }

        @keyframes logo-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes link-flow { to { stroke-dashoffset: -120; } }
        @keyframes portal-pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.55; }
        }
        @keyframes node-glow {
            from { opacity: 0.45; }
            to { opacity: 1; }
        }
        @keyframes island-drift {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        @keyframes star-twinkle {
            from { opacity: 0.55; }
            to { opacity: 0.95; }
        }

        .hero-content {
            width: min(920px, calc(100% - 2.5rem));
            padding: clamp(2.5rem, 7vh, 4.5rem) 0 clamp(3.5rem, 10vh, 6rem);
        }

        .hero-logo {
            display: block;
            width: min(260px, 62vw);
            height: auto;
            margin: 0 auto 1.1rem;
            filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.45));
        }

        .hero-logo-missing { display: none; color: #f0b4b4; margin: 0 0 1rem; }

        .brand {
            margin: 0 0 0.85rem;
            font-family: "Unbounded", sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 6.5vw, 3.8rem);
            line-height: 0.95;
            letter-spacing: -0.03em;
        }

        .brand span {
            display: block;
            margin-top: 0.45rem;
            font-weight: 500;
            font-size: 0.36em;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--matrix);
        }

        .tagline {
            margin: 0 auto 1.1rem;
            max-width: 36ch;
            font-size: 1.05rem;
            color: rgba(223, 243, 240, 0.78);
        }

        .visitors { display: flex; justify-content: center; margin: 0 0 1.35rem; }
        .visitors img { height: 20px; width: auto; }

        .cta { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.75rem; }
        .cta a, a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            min-height: 2.85rem;
            padding: 0.7rem 1.15rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.25s var(--ease), background 0.25s ease, border-color 0.25s ease;
        }
        .cta a:hover, a.btn:hover { transform: translateY(-2px); }

        .cta .community, a.btn.community {
            border: 1px solid rgba(74, 222, 128, 0.35);
            background: rgba(6, 24, 32, 0.72);
            color: #e8fff2;
        }
        .cta .community:hover, a.btn.community:hover {
            background: rgba(10, 48, 42, 0.9);
            border-color: rgba(74, 222, 128, 0.7);
        }

        a.btn.primary {
            background: var(--matrix);
            color: #062016;
            border: none;
        }
        a.btn.primary:hover { background: #6aee98; }
        a.btn.ghost {
            border: 1px solid rgba(11, 61, 70, 0.25);
            background: #fff;
            color: var(--sea-deep);
        }
        a.btn.ghost:hover { border-color: var(--matrix-dim); }
        a.btn.disabled { pointer-events: none; opacity: 0.45; transform: none; }

        .discord-icon {
            width: 18px;
            height: 18px;
            object-fit: cover;
            border-radius: 3px;
        }

        main {
            width: min(860px, calc(100% - 2.5rem));
            margin: 0 auto;
            padding: clamp(2.5rem, 6vw, 4rem) 0 3rem;
        }

        section { margin: 0 0 1rem; }
        section h2 {
            margin: 1.75rem 0 0.7rem;
            font-family: "Unbounded", sans-serif;
            font-weight: 700;
            font-size: clamp(1.15rem, 2.4vw, 1.4rem);
            letter-spacing: -0.02em;
            color: var(--sea-deep);
        }

        .card {
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 1.15rem 1.25rem;
            box-shadow: 0 10px 30px rgba(11, 61, 70, 0.05);
        }

        .card p { margin: 0; color: var(--ink); }
        .card .hint { margin-top: 0.45rem; color: var(--ink-soft); font-size: 0.95rem; }
        .card code { color: var(--sea); font-size: 0.92em; }

        .row-card {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .row-card .info { flex: 1; min-width: 220px; }
        .row-card strong {
            display: block;
            font-family: "Unbounded", sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            margin-bottom: 0.25rem;
            color: var(--sea-deep);
        }

        .meta {
            margin-top: 2.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--line);
            color: var(--ink-soft);
            font-size: 0.88rem;
        }
        .meta code { color: var(--sea); }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(120%);
            background: var(--sea-deep);
            color: var(--foam);
            padding: 12px 18px;
            border-radius: 4px;
            opacity: 0;
            transition: transform 0.35s ease, opacity 0.35s ease;
            z-index: 30;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>

<script>
(function () {
    const $ = (id) => document.getElementById(id);
    const toastEl = $("toast");
    let toastTimer;
    let lang = localStorage.getItem("re9ap_lang") || "en";

    const SOURCE_DOWNLOAD_URL = "https://github.com/LechapelierHD/Re9-archipelago/releases/download/v2.1.42/RE9_AP_Source_2.1.42.zip";
    const SOURCE_VERSION = "2.1.42";
    const CLIENT_DOWNLOAD_URL = "https://github.com/LechapelierHD/Re9-archipelago/releases/download/v2.1.42/RE9-AP-Client-2.1.42.zip";
    const CLIENT_VERSION = "2.1.42";
    const DISCORD_URL = "https://lechapelierhd.github.io/synthetic-shores/";

    const heroLogo = $("heroLogo");

    if (heroLogo && heroMissing) {
        heroLogo.addEventListener("error", () => {
            heroLogo.style.display = "none";
            heroMissing.style.display = "block";
        });
    }

    const I18N = {
        fr: {
            title: "RE9 AP — Configuration",
            tagline: "Guide rapide pour le client RE9 Archipelago.",
            h_source: "Code source",
            source_desc: "Lua, apworld Python et lanceur C# du projet, sur GitHub.",

            hint_source_ready: "Le code du projet est sur GitHub.",

            client_desc: "Launcher + scripts Archipelago pour Resident Evil Requiem.",

            hint_ready: "Clique sur Télécharger pour obtenir le client.",
            hint_version: "Version {v}",
            btn_download: "Télécharger",
            btn_github: "GitHub",
            h_install: "1. Installation",
            install_p: "Installe <strong>Resident Evil Requiem</strong> via Steam, télécharge le client ci-dessus, puis lance <code>RE9.AP.Launcher.exe</code>.",
            install_hint: "Le launcher pose REFramework + les scripts Lua ArchipelagoRE9. Relance le jeu après une mise à jour de patch.",
            h_connect: "2. Connexion in-game",
            connect_p: "Génère le multiworld avec Archipelago (apworld <strong>Resident Evil Requiem</strong>), puis dans le jeu ouvre l’UI RE9 AP :",
            connect_hint: "Serveur · Nom du slot · Mot de passe → <strong>Enregistrer et connecter</strong>. La difficulté YAML doit être celle de ta save.",
            h_discord: "Communauté",
            discord_title: "Synthorium",

        },
        en: {

            client_desc: "Launcher + Archipelago scripts for Resident Evil Requiem.",
            hint_paste: "Client not configured yet.",
            hint_ready: "Click Download to get the client.",
            hint_version: "Version {v}",
            btn_download: "Download",
            btn_github: "GitHub",
            h_install: "1. Install",
            install_p: "Install <strong>Resident Evil Requiem</strong> via Steam, download the client above, then run <code>RE9.AP.Launcher.exe</code>.",
            install_hint: "The launcher installs REFramework + ArchipelagoRE9 Lua scripts. Restart the game after a patch update.",
            h_connect: "2. In-game connection",
            connect_p: "Generate the multiworld with Archipelago (<strong>Resident Evil Requiem</strong> apworld), then open the RE9 AP UI in-game:",

            bug_hint: "If possible, attach <code>re2_framework_log.txt</code> (game folder) — lines starting with <code>[RE9 AP]</code>. Server: <a href=\"https://lechapelierhd.github.io/synthetic-shores/\" target=\"_blank\" rel=\"noopener noreferrer\">Synthetic Shores</a>.",
            meta: "Target client folder: <code>Resident Evil 9 AP</code> · AP game: <code>Resident Evil Requiem</code>",
        },
    };

    function t(key) {
        return (I18N[lang] && I18N[lang][key]) || I18N.fr[key] || key;
    }

    function applyLang() {
        document.documentElement.lang = lang;
        document.title = t("title");
        document.querySelectorAll("[data-i18n]").forEach((el) => {
            el.textContent = t(el.getAttribute("data-i18n"));
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
            el.innerHTML = t(el.getAttribute("data-i18n-html"));
        });
        document.querySelectorAll(".lang-tabs button").forEach((btn) => {
            const active = btn.getAttribute("data-lang") === lang;
            btn.classList.toggle("active", active);
            btn.setAttribute("aria-selected", active ? "true" : "false");
        });
        syncClientDownload();
        syncSourceDownload();
        ["discordBtn", "discordTopBtn"].forEach((id) => {
            const a = $(id);
            if (a) a.href = DISCORD_URL;
        });
        localStorage.setItem("re9ap_lang", lang);
    }

    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function syncDownload(btnId, hintId, url, version, pasteKey, readyKey) {
        const btn = $(btnId);
        const hint = $(hintId);
        if (!btn || !hint) return;
        const cleanUrl = (url || "").trim();
        const cleanVersion = (version || "").trim();
        const valid = /^https?:\/\//i.test(cleanUrl);
        btn.href = valid ? cleanUrl : "#";
        btn.classList.toggle("disabled", !valid);
        if (!valid) hint.textContent = t(pasteKey);
        else if (cleanVersion) hint.textContent = t("hint_version").replace("{v}", cleanVersion);
        else hint.textContent = t(readyKey);
    }

    function syncSourceDownload() {
        syncDownload("sourceDownloadBtn", "sourceVersionHint", SOURCE_DOWNLOAD_URL, SOURCE_VERSION, "hint_source_paste", "hint_source_ready");
    }

    function syncClientDownload() {
        syncDownload("clientDownloadBtn", "clientVersionHint", CLIENT_DOWNLOAD_URL, CLIENT_VERSION, "hint_paste", "hint_ready");
    }

    document.querySelectorAll(".lang-tabs button").forEach((btn) => {
        btn.addEventListener("click", () => {
            lang = btn.getAttribute("data-lang");
            applyLang();
        });
    });

    applyLang();
    void toast;
})();
</script>
</body>
</html>
